[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# Where to host releases
hosting = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]
# ~/.local/bin on every platform, as uv does, rather than ~/.cargo/bin: most
# people installing this are not Rust developers. `sync` looks here when a
# command run over ssh does not have it on the PATH.
install-path = "~/.local/bin"
# Ship `agent-meter-update`, which moves an installed copy to the newest release.
install-updater = true
# Whether dist should create a Github Release or use an existing draft
create-release = true
# On a pull request, only check that a release could be planned.
pr-run-mode = "plan"
